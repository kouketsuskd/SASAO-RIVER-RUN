<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#071019"><title>SASAO RIVER RUN v2</title><style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020507;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}body{display:grid;place-items:center}#wrap{position:relative;width:100vw;height:100dvh;background:#020507}canvas{display:block;width:100%;height:100%;touch-action:none}.overlay{position:absolute;inset:0;z-index:30;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 50% 22%,#29475c,#081019 58%,#020305)}.card{width:min(92vw,560px);padding:22px 18px;border:2px solid #d9f0ff;background:#06101bee;text-align:center;box-shadow:0 0 60px #000,0 0 32px #7ad7ff3d}.logo{font-weight:1000;font-size:clamp(34px,9vw,66px);line-height:.88;letter-spacing:-2px;text-shadow:0 4px 0 #102433,0 0 24px #9bdfff55}.sub{margin-top:14px;font-size:14px;line-height:1.8;color:#d9e5ee}button{font:inherit;color:#fff;background:#07131d;border:2px solid #e9f7ff;padding:14px 24px;font-weight:900;font-size:19px}button:active{transform:scale(.98)}#startBtn,#retryBtn{margin-top:18px}.hidden{display:none!important}#hud{position:absolute;inset:0;z-index:10;pointer-events:none}.topbar{position:absolute;top:max(8px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;text-shadow:0 2px 4px #000}.panel{background:#06101bcc;border:1px solid #d9f0ff88;padding:7px 9px;backdrop-filter:blur(4px)}.big{font-weight:900;font-size:15px}.small{font-size:11px;color:#d5e2ea;margin-top:2px}#driverStrip{position:absolute;left:8px;right:8px;bottom:calc(72px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(6,1fr);gap:5px;pointer-events:auto}.driver{min-width:0;padding:6px 2px;border:1px solid #c9e9fa88;background:#07121ddd;text-align:center;font-size:10px;font-weight:800;line-height:1.2}.driver b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.driver.active{outline:2px solid #fff;background:#153044}.driver.cool{opacity:.45}#controls{position:absolute;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));height:58px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;pointer-events:auto}.ctrl{border:1px solid #d9f0ff99;background:#07121de8;color:#fff;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px}.ctrl:active{background:#16324a}#skillBtn{border:2px solid #fff}#toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);padding:8px 12px;background:#06101bea;border:1px solid #d9f0ff;font-weight:900;font-size:13px;opacity:0;transition:opacity .18s;white-space:nowrap}#hint{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);padding:7px 10px;background:#06101bbb;border:1px solid #d9f0ff66;font-size:12px;text-align:center;pointer-events:none}
</style></head><body><div id="wrap"><canvas id="game"></canvas><div id="hud" class="hidden"><div class="topbar"><div class="panel"><div class="big" id="distanceTxt">SASAO 6200m</div><div class="small" id="speedTxt">36 km/h</div></div><div class="panel"><div class="big" id="hpTxt">軽トラ HP 100</div><div class="small" id="dangerTxt">荷台 安定</div></div></div><div id="toast"></div><div id="hint">画面を左右ドラッグ＝ハンドル<br>急ハンドルは荷台が振られる</div><div id="driverStrip"></div><div id="controls"><div class="ctrl" id="brakeBtn">ブレーキ</div><div class="ctrl" id="skillBtn">特殊能力</div><div class="ctrl" id="gasBtn">アクセル</div></div></div><div class="overlay" id="start"><div class="card"><div class="logo">SASAO<br>RIVER RUN</div><div class="sub">軽トラを本当に運転してササオ川へ。<br><b>画面下から上へ進む道を左右にハンドル操作。</b><br>何もしなければカーブで路肩へ突っ込む。<br>急ハンドルすると荷台の5人が振られて落ちる。</div><button id="startBtn">エンジンをかける</button></div></div><div class="overlay hidden" id="end"><div class="card"><div class="logo" id="endTitle">GAME OVER</div><div class="sub" id="endMsg"></div><button id="retryBtn">もう一度走る</button></div></div></div><script>
(()=>{const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const hud=document.getElementById('hud'),start=document.getElementById('start'),end=document.getElementById('end');const dTxt=document.getElementById('distanceTxt'),sTxt=document.getElementById('speedTxt'),hpTxt=document.getElementById('hpTxt'),dangerTxt=document.getElementById('dangerTxt');const strip=document.getElementById('driverStrip'),toast=document.getElementById('toast'),hint=document.getElementById('hint');const brakeBtn=document.getElementById('brakeBtn'),gasBtn=document.getElementById('gasBtn'),skillBtn=document.getElementById('skillBtn');let W=390,H=844,DPR=1;function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const drivers=[{name:'トシユキ',skill:'ザ・ワールド',cd:12},{name:'イサジ',skill:'鬼ドライブ',cd:13},{name:'カズアキ',skill:'超耐久',cd:15},{name:'マッピー',skill:'安定化',cd:9},{name:'リョウゴ',skill:'虫の知らせ',cd:11},{name:'ケイタ',skill:'鳳翼天翔',cd:14}];let state,ptr=false,lastPX=0,braking=false,gassing=false,toastTimer=0;
function makeState(){return{running:true,won:false,dist:6200,progress:0,speed:36,hp:100,carX:0,carVX:0,steer:0,curve:0,driver:0,freeze:0,boost:0,inv:0,vision:0,skillCD:Array(6).fill(0),pass:[-42,-21,0,21,42].map((x,i)=>({base:x,x,vx:0,fallen:false,i})),obs:[],spawnT:.65,shake:0,t:0}}
function roadCenterAt(z){const p=state.progress*.0017;return(Math.sin(p+z*2.4)*.36+Math.sin(p*.58+z*5.2)*.19)*W*.34}function roadHalfAt(z){return W*(.33-z*.12)}function spawnObstacle(){const r=Math.random();let type=r<.24?'car':r<.48?'rock':r<.70?'hole':r<.86?'barrel':'bridge';let lane=Math.random()*1.55-.775;if(type==='bridge')lane=0;state.obs.push({type,z:1.08,lane,hit:false})}
function reset(){state=makeState();buildDrivers();hint.style.opacity='1';setTimeout(()=>hint.style.opacity='0',3600)}function buildDrivers(){strip.innerHTML='';drivers.forEach((d,i)=>{let el=document.createElement('div');el.className='driver'+(i===state.driver?' active':'');el.innerHTML='<b>'+d.name+'</b><span>'+d.skill+'</span>';el.onclick=()=>{if(!state.running)return;state.driver=i;buildDrivers();showToast(d.name+'に交代')};strip.appendChild(el)})}function showToast(s){toast.textContent=s;toast.style.opacity='1';toastTimer=1.4}
function useSkill(){if(!state.running)return;let i=state.driver;if(state.skillCD[i]>0){showToast('まだ使えない');return}state.skillCD[i]=drivers[i].cd;if(i===0)state.freeze=3;if(i===1)state.boost=8;if(i===2)state.hp=Math.min(100,state.hp+30);if(i===3)state.pass.forEach(p=>{p.x=p.base;p.vx*=.12});if(i===4)state.vision=6;if(i===5)state.inv=2.2;showToast(drivers[i].skill+'！');buildDrivers()}skillBtn.onclick=useSkill;
function hold(el,setter){el.addEventListener('pointerdown',e=>{e.preventDefault();setter(true);el.setPointerCapture?.(e.pointerId)});['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,()=>setter(false)))}hold(brakeBtn,v=>braking=v);hold(gasBtn,v=>gassing=v);canvas.addEventListener('pointerdown',e=>{if(!state?.running)return;ptr=true;lastPX=e.clientX;canvas.setPointerCapture?.(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!ptr||!state?.running)return;let dx=e.clientX-lastPX;lastPX=e.clientX;state.steer=Math.max(-1,Math.min(1,state.steer+dx/(W*.13)))});canvas.addEventListener('pointerup',()=>ptr=false);canvas.addEventListener('pointercancel',()=>ptr=false);
function update(dt){if(!state?.running)return;state.t+=dt;toastTimer-=dt;if(toastTimer<=0)toast.style.opacity='0';drivers.forEach((d,i)=>state.skillCD[i]=Math.max(0,state.skillCD[i]-dt));state.freeze=Math.max(0,state.freeze-dt);state.boost=Math.max(0,state.boost-dt);state.inv=Math.max(0,state.inv-dt);state.vision=Math.max(0,state.vision-dt);state.steer*=Math.pow(.20,dt);const targetSpeed=braking?15:(gassing?62:(state.boost>0?74:38));state.speed+=(targetSpeed-state.speed)*Math.min(1,dt*(braking?4:1.2));const c0=roadCenterAt(.06),c1=roadCenterAt(.18);state.curve=(c1-c0)/(W*.12);state.carVX+=(state.steer*520-state.curve*340*(state.speed/40))*dt;state.carVX*=Math.pow(.08,dt);state.carX+=state.carVX*dt;state.progress+=state.speed*dt*1.95;state.dist=Math.max(0,6200-state.progress);const half=roadHalfAt(.06)*.83,edge=Math.abs(state.carX-c0)-half;if(edge>0){state.hp-=dt*(8+edge*.09);state.carVX+=Math.sign(c0-state.carX)*90*dt;state.shake=Math.max(state.shake,4)}const lat=state.carVX/220+state.steer*1.6-state.curve*.9;state.pass.forEach((p,idx)=>{if(p.fallen)return;const spring=(p.base-p.x)*7.5,force=lat*95+spring;p.vx+=force*dt;p.vx*=Math.pow(.13,dt);p.x+=p.vx*dt;if(Math.abs(p.x)>78){p.fallen=true;endGame(false,'荷台から仲間が落ちた。')}});state.spawnT-=dt;if(state.spawnT<=0){spawnObstacle();state.spawnT=Math.max(.48,1.15-Math.min(.45,state.progress/14000))+Math.random()*.45}const move=(state.freeze>0?0:state.speed*dt/520);state.obs.forEach(o=>o.z-=move);for(const o of state.obs){if(o.hit||o.z<-.08||o.z>.18)continue;const z=Math.max(0,o.z),center=roadCenterAt(z),x=center+o.lane*roadHalfAt(z)*.72,truckX=W/2+state.carX,ox=W/2+x;let rad=o.type==='car'?30:o.type==='bridge'?54:24;if(Math.abs(truckX-ox)<rad+26){o.hit=true;if(state.inv>0)continue;let dmg=o.type==='car'?24:o.type==='rock'?18:o.type==='hole'?14:o.type==='barrel'?12:10;if(state.boost>0)dmg*=.45;state.hp-=dmg;state.shake=12;state.pass.forEach(p=>p.vx+=(Math.random()-.5)*220);showToast('衝撃！ -'+Math.round(dmg)+'HP')}}state.obs=state.obs.filter(o=>o.z>-.18);state.hp=Math.max(0,state.hp);if(state.hp<=0)endGame(false,'軽トラが壊れた。');if(state.dist<=0)endGame(true,'5人を落とさずササオ川に到着！')}
function endGame(win,msg){if(!state.running)return;state.running=false;state.won=win;document.getElementById('endTitle').textContent=win?'SASAO 到着':'GAME OVER';document.getElementById('endMsg').textContent=msg+'　残り '+Math.ceil(state.dist)+'m';end.classList.remove('hidden');hud.classList.add('hidden')}
function lerp(a,b,t){return a+(b-a)*t}function roadPoint(z){return{y:lerp(H*.73,H*.09,z),center:W/2+roadCenterAt(z),half:roadHalfAt(z)}}function drawRoad(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#17321f');g.addColorStop(.55,'#102519');g.addColorStop(1,'#08130d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);const sky=ctx.createLinearGradient(0,0,0,H*.38);sky.addColorStop(0,'#18384c');sky.addColorStop(1,'rgba(18,43,58,0)');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H*.46);ctx.globalAlpha=.35;for(let i=0;i<20;i++){let z=(state.t*.45+i/20)%1,p=roadPoint(z),side=i%2?-1:1,x=p.center+side*(p.half+25+(i*31)%70);ctx.strokeStyle='#9bc8a2';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,p.y);ctx.lineTo(x+side*4,p.y+18);ctx.stroke()}ctx.globalAlpha=1;const N=42;ctx.beginPath();for(let i=0;i<=N;i++){let p=roadPoint(i/N);if(i===0)ctx.moveTo(p.center-p.half,p.y);else ctx.lineTo(p.center-p.half,p.y)}for(let i=N;i>=0;i--){let p=roadPoint(i/N);ctx.lineTo(p.center+p.half,p.y)}ctx.closePath();ctx.fillStyle='#20262a';ctx.fill();for(const side of[-1,1]){ctx.beginPath();for(let i=0;i<=N;i++){let p=roadPoint(i/N),x=p.center+side*p.half;if(i===0)ctx.moveTo(x,p.y);else ctx.lineTo(x,p.y)}ctx.strokeStyle='#d7d2aa';ctx.lineWidth=5;ctx.stroke()}for(let k=0;k<13;k++){let z=(k/13+state.progress/430)%1,z2=Math.min(1,z+.045),p=roadPoint(z),q=roadPoint(z2);ctx.strokeStyle='#e9e7d5';ctx.lineWidth=lerp(4,1,z);ctx.beginPath();ctx.moveTo(p.center,p.y);ctx.lineTo(q.center,q.y);ctx.stroke()}}
function drawObstacle(o){if(o.z<0||o.z>1.08)return;let p=roadPoint(o.z),x=p.center+o.lane*p.half*.72,y=p.y,sc=lerp(1,.25,o.z);ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);if(state.vision>0){ctx.shadowColor='#ffec7a';ctx.shadowBlur=16}if(o.type==='car'){ctx.fillStyle='#823d31';ctx.fillRect(-20,-30,40,58);ctx.fillStyle='#b8d4df';ctx.fillRect(-14,-19,28,14);ctx.fillStyle='#f7e6a4';ctx.fillRect(-17,19,8,6);ctx.fillRect(9,19,8,6)}else if(o.type==='rock'){ctx.fillStyle='#585a57';ctx.beginPath();ctx.moveTo(-23,20);ctx.lineTo(-17,-13);ctx.lineTo(6,-25);ctx.lineTo(24,6);ctx.lineTo(11,23);ctx.closePath();ctx.fill()}else if(o.type==='hole'){ctx.fillStyle='#090b0d';ctx.beginPath();ctx.ellipse(0,0,27,15,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#3b3834';ctx.lineWidth=5;ctx.stroke()}else if(o.type==='barrel'){ctx.fillStyle='#d56b26';ctx.fillRect(-13,-20,26,40);ctx.fillStyle='#f0f0e5';ctx.fillRect(-13,-5,26,7)}else{ctx.strokeStyle='#eee6c7';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-50,-22);ctx.lineTo(-50,30);ctx.moveTo(50,-22);ctx.lineTo(50,30);ctx.stroke();ctx.fillStyle='#675d49';ctx.fillRect(-47,-6,94,18)}ctx.restore()}
function drawTruck(){let cx=W/2+state.carX,cy=H*.74;ctx.save();if(state.shake>0){ctx.translate((Math.random()-.5)*state.shake,(Math.random()-.5)*state.shake);state.shake*=.82}ctx.translate(cx,cy);ctx.rotate(Math.max(-.18,Math.min(.18,state.carVX/900)));ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(0,22,48,25,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#cdd5d9';ctx.fillRect(-43,-34,86,58);ctx.strokeStyle='#66727a';ctx.lineWidth=3;ctx.strokeRect(-43,-34,86,58);ctx.fillStyle='#e6ecef';ctx.fillRect(-34,18,68,42);ctx.fillStyle='#9cc1d1';ctx.fillRect(-25,22,50,18);ctx.fillStyle='#222';ctx.fillRect(-42,39,9,18);ctx.fillRect(33,39,9,18);state.pass.forEach((pp,i)=>{if(pp.fallen)return;let py=-8+(i%2)*12;ctx.save();ctx.translate(pp.x,py);ctx.fillStyle=['#e0bd70','#d59c73','#c8c8c8','#d3aa78','#bd9d76'][i];ctx.beginPath();ctx.arc(0,-9,7,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#17202a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,-2);ctx.lineTo(0,11);ctx.stroke();ctx.restore()});ctx.fillStyle='#18222a';ctx.beginPath();ctx.arc(0,32,6,0,Math.PI*2);ctx.fill();if(state.inv>0){ctx.strokeStyle='#ffd966';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,5,58,0,Math.PI*2);ctx.stroke()}ctx.restore()}
function render(){ctx.clearRect(0,0,W,H);if(!state)return;drawRoad();state.obs.slice().sort((a,b)=>b.z-a.z).forEach(drawObstacle);drawTruck();dTxt.textContent='SASAO '+Math.ceil(state.dist)+'m';sTxt.textContent=Math.round(state.speed)+' km/h';hpTxt.textContent='軽トラ HP '+Math.ceil(state.hp);const worst=Math.max(...state.pass.map(p=>Math.abs(p.x-p.base)));dangerTxt.textContent=worst>24?'荷台 危険！':worst>13?'荷台 揺れてる':'荷台 安定';skillBtn.textContent=drivers[state.driver].skill+(state.skillCD[state.driver]>0?' '+state.skillCD[state.driver].toFixed(1):'');[...strip.children].forEach((el,i)=>{el.classList.toggle('active',i===state.driver);el.classList.toggle('cool',state.skillCD[i]>0)})}
let last=performance.now();function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);document.getElementById('startBtn').onclick=()=>{reset();start.classList.add('hidden');end.classList.add('hidden');hud.classList.remove('hidden')};document.getElementById('retryBtn').onclick=()=>{reset();end.classList.add('hidden');hud.classList.remove('hidden')};reset();state.running=false})();
</script></body></html>
