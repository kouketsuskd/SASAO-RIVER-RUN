<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#071019"><title>SASAO RIVER RUN</title><style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020507;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}body{display:grid;place-items:center}#wrap{position:relative;width:100vw;height:100dvh;background:#000}canvas{display:block;width:100%;height:100%;touch-action:none}.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 50% 25%,#2b4c63,#08111b 56%,#020305)}.card{width:min(92vw,560px);padding:22px 18px;border:2px solid #d9f0ff;background:#06101bea;text-align:center;box-shadow:0 0 60px #000,0 0 32px #7ad7ff3d}.logo{font-weight:1000;font-size:clamp(34px,9vw,66px);line-height:.87;letter-spacing:-2px;text-shadow:0 4px 0 #102433,0 0 24px #9bdfff55}.logo em{display:block;color:#dff6ff;font-style:normal;font-size:.37em;letter-spacing:4px;margin-top:14px}.sub{font-size:12px;line-height:1.8;color:#b9c9d5;margin:18px auto 4px;max-width:420px}button{margin-top:15px;padding:14px 28px;border:2px solid #fff;background:#06101b;color:#fff;font:900 17px monospace;box-shadow:0 0 24px #75d8ff33}.hidden{display:none!important}#rotate{display:none;position:absolute;inset:0;z-index:50;background:#000;place-items:center;text-align:center;padding:28px;font-weight:900}@media(orientation:landscape) and (max-height:850px){#rotate{display:grid}}
</style></head><body><div id="wrap"><canvas id="game" width="540" height="960"></canvas><div id="start" class="overlay"><div class="card"><div class="logo">SASAO<br>RIVER RUN<em>軽トラで川まで行け。</em></div><div class="sub">運転手を交代しながら、荷台の5人を一人も落とさずササオ川へ。<br>アクセルは押しっぱなし。画面を左右にドラッグして車体を傾ける。</div><button id="startButton">川へ向かう</button></div></div><div id="ending" class="overlay hidden"><div class="card"><div id="endingTitle" class="logo">到着</div><p id="endingText" class="sub"></p><button id="restartButton">もう一度走る</button></div></div><div id="rotate">iPhoneを縦向きにしてください</div></div>
<script>
'use strict';
const G={W:540,H:960,c:null,x:null,last:0,t:0,state:'TITLE',dist:0,goal:5200,speed:0,hp:100,driver:0,shake:0,flash:0,tilt:0,targetTilt:0,skill:0,skillCD:[0,0,0,0,0,0],driverSwapCD:0,startGrace:0,particles:[],dust:[],rocks:[],road:[],stars:[],inputX:270,drag:false,camY:0,warning:'',warnT:0,bgm:null};
const chars=[
 {name:'トシユキ',short:'トシ',hair:'#15171d',skin:'#d8ae84',shirt:'#5f556d',skill:'ザ・ワールド',desc:'障害物を3秒止める'},
 {name:'イサジ',short:'イサジ',hair:'#d5b641',skin:'#c79065',shirt:'#111217',skill:'鬼ドライブ',desc:'加速＋衝撃無効'},
 {name:'カズアキ',short:'カズ',hair:'#151515',skin:'#8b5638',shirt:'#24303a',skill:'ワールド・イズ・マイン',desc:'車体HPを回復'},
 {name:'マッピー',short:'マッピー',hair:'#222',skin:'#d1a174',shirt:'#735f42',skill:'ピラミッド・スタビライザー',desc:'荷台を強制安定'},
 {name:'リョウゴ',short:'リョウゴ',hair:'#171719',skin:'#d0a078',shirt:'#325b6f',skill:'虫の知らせ',desc:'危険を先読み＋減速'},
 {name:'ケイタ',short:'ケイタ',hair:'#d2a93d',skin:'#c99263',shirt:'#a34b28',skill:'鳳翼天翔',desc:'大ジャンプで障害物回避'}
];
const riders=[];
function rr(a,b){return a+Math.random()*(b-a)} function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function terrain(x){return 680 + Math.sin(x*.0045)*26 + Math.sin(x*.012)*13 + (x>880&&x<1100? -58*Math.sin((x-880)/220*Math.PI):0)+(x>1750&&x<2010?55*Math.sin((x-1750)/260*Math.PI):0)+(x>3150&&x<3430?-82*Math.sin((x-3150)/280*Math.PI):0)+(x>4200&&x<4490?68*Math.sin((x-4200)/290*Math.PI):0)}
function reset(){G.t=0;G.dist=0;G.speed=110;G.hp=100;G.driver=0;G.shake=0;G.flash=0;G.tilt=0;G.targetTilt=0;G.skill=0;G.skillCD=[0,0,0,0,0,0];G.driverSwapCD=0;G.startGrace=2.0;G.rocks=[];G.particles=[];G.dust=[];G.warning='';G.warnT=0;riders.length=0;for(let i=0;i<5;i++){const targetX=(i-2)*48;const targetY=-3-Math.abs(i-2)*2;riders.push({slot:i,x:targetX,y:targetY,vx:0,vy:0,rot:0,vr:0,air:0,fallen:false,bounce:0})}G.state='PLAY';}
function initWorld(){for(let i=0;i<80;i++)G.stars.push({x:rr(0,540),y:rr(0,520),a:rr(.15,.8),s:rr(.4,1.6)});}
function sfx(type){try{if(!G.ac)G.ac=new(window.AudioContext||window.webkitAudioContext)();const o=G.ac.createOscillator(),g=G.ac.createGain();o.connect(g);g.connect(G.ac.destination);const n=G.ac.currentTime;if(type==='hit'){o.type='square';o.frequency.setValueAtTime(110,n);o.frequency.exponentialRampToValueAtTime(42,n+.18);g.gain.setValueAtTime(.11,n);g.gain.exponentialRampToValueAtTime(.001,n+.2)}else if(type==='skill'){o.type='sawtooth';o.frequency.setValueAtTime(180,n);o.frequency.exponentialRampToValueAtTime(720,n+.28);g.gain.setValueAtTime(.08,n);g.gain.exponentialRampToValueAtTime(.001,n+.3)}else{o.frequency.value=420;g.gain.setValueAtTime(.035,n);g.gain.exponentialRampToValueAtTime(.001,n+.06)}o.start(n);o.stop(n+.32)}catch(e){}}
function useSkill(){if(G.state!=='PLAY'||G.skillCD[G.driver]>0)return;sfx('skill');G.skillCD[G.driver]=12;G.skill=3.2;const d=G.driver;if(d===2)G.hp=Math.min(100,G.hp+32);if(d===3)for(const r of riders){r.vx*=.15;r.vy*=.1;r.vr*=.1;r.x=0;r.y=0}if(d===5){for(const r of riders)r.vy=-180;G.camY=-18}for(let i=0;i<60;i++)G.particles.push({x:270,y:650,vx:rr(-170,170),vy:rr(-260,20),l:rr(.25,.8),m:rr(1,4)});}
function switchDriver(i){if(G.driverSwapCD>0||i===G.driver||G.state!=='PLAY')return;const old=G.driver;G.driver=i;G.driverSwapCD=.8;sfx('tap');for(const r of riders){r.vx+=rr(-20,20);r.vy-=18}G.warning=chars[old].short+' → '+chars[i].short;G.warnT=1.1;}
function spawnRock(){const x=G.dist+rr(550,900);G.rocks.push({x,y:terrain(x)-rr(80,180),r:rr(14,27),vy:rr(40,90),hit:false});}
function update(dt){if(G.state!=='PLAY')return;G.t+=dt;G.skill=Math.max(0,G.skill-dt);G.driverSwapCD=Math.max(0,G.driverSwapCD-dt);G.startGrace=Math.max(0,G.startGrace-dt);G.warnT=Math.max(0,G.warnT-dt);G.shake=Math.max(0,G.shake-dt*15);G.flash=Math.max(0,G.flash-dt*4);for(let i=0;i<6;i++)G.skillCD[i]=Math.max(0,G.skillCD[i]-dt);
 let target=180;if(G.driver===1&&G.skill>0)target=285;if(G.driver===4&&G.skill>0)target=92;G.speed+=(target-G.speed)*dt*1.1;G.speed-=Math.abs(G.tilt)*20*dt;G.speed=clamp(G.speed,65,310);G.dist+=G.speed*dt;
 const roadY=terrain(G.dist), roadAhead=terrain(G.dist+85), slope=clamp((roadAhead-roadY)/90,-.9,.9);G.targetTilt=clamp(G.targetTilt,-1,1);G.tilt+=(G.targetTilt+slope*.9-G.tilt)*dt*4.5;
 const bump=Math.abs(terrain(G.dist+20)-terrain(G.dist-20));if(bump>24&&Math.random()<dt*5){for(const r of riders){r.vy-=rr(45,110);r.vx+=rr(-18,18)}G.shake=Math.max(G.shake,4)}
 if(Math.random()<dt*.11&&G.dist>700&&G.dist<G.goal-500)spawnRock();
 for(const rock of G.rocks){if(!(G.driver===0&&G.skill>0))rock.vy+=180*dt;rock.y+=rock.vy*dt;const gy=terrain(rock.x)-rock.r;if(rock.y>gy){rock.y=gy;rock.vy*=-.25}const dx=rock.x-G.dist;if(!rock.hit&&Math.abs(dx)<60&&Math.abs(rock.y-(roadY-45))<72){rock.hit=true;if(!(G.driver===1&&G.skill>0)){G.hp-=rr(8,15);G.shake=12;G.flash=.5;sfx('hit');for(const r of riders){r.vx+=rr(-80,90);r.vy-=rr(70,160);r.vr+=rr(-3,3)}}}}
 G.rocks=G.rocks.filter(r=>r.x>G.dist-300);
 const abilityStabilize=(G.driver===3&&G.skill>0);const baseShock=Math.abs(slope)*G.speed*.18;
 riders.forEach((r,i)=>{const targetX=(i-2)*48;const targetY=-3-Math.abs(i-2)*2;r.vy+=430*dt;r.vx+=(-r.x+targetX)*dt*3.1;r.vx*=Math.pow(.2,dt);r.x+=r.vx*dt;r.y+=r.vy*dt;r.rot+=r.vr*dt;r.vr*=Math.pow(.25,dt);if(r.y>targetY){const impact=r.vy;r.y=targetY;r.vy*=-.24;r.vr+=r.vx*.004;if(impact>170&&!abilityStabilize){r.vx+=rr(-35,35)+G.tilt*55;r.vy-=impact*.18}}if(abilityStabilize){r.x+=(targetX-r.x)*dt*8;r.y+=(targetY-r.y)*dt*8;r.rot*=Math.pow(.01,dt)}else{r.vx+=G.tilt*baseShock*dt*.14;r.rot+=(G.tilt*.24-r.rot)*dt*2.2}
  if(G.startGrace<=0&&(Math.abs(r.x-targetX)>112||r.y>105)){r.fallen=true}
 });
 if(riders.some(r=>r.fallen)){G.state='LOSE';end(false,'荷台から仲間が落ちた。\nササオ川まで '+Math.floor(G.goal-G.dist)+'m。');return}
 if(G.hp<=0){G.state='LOSE';end(false,'軽トラが限界を迎えた。\nササオ川まで '+Math.floor(G.goal-G.dist)+'m。');return}
 if(G.dist>=G.goal){G.state='WIN';end(true,'6人全員でササオ川に到着。\n誰も落ちなかった。');return}
 if(G.driver===4&&G.skill>0){let danger=G.rocks.find(r=>r.x>G.dist&&r.x<G.dist+700);if(danger){G.warning='虫の知らせ：前方に落石';G.warnT=.15}}
 for(const p of G.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=220*dt;p.l-=dt}G.particles=G.particles.filter(p=>p.l>0);if(Math.random()<dt*30)G.dust.push({x:155+rr(-10,10),y:roadY+rr(2,8),vx:rr(-40,-10),vy:rr(-20,5),l:rr(.2,.5)});for(const p of G.dust){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}G.dust=G.dust.filter(p=>p.l>0);
}
function end(win,text){document.getElementById('endingTitle').textContent=win?'SASAO RIVER':'GAME OVER';document.getElementById('endingText').textContent=text;document.getElementById('ending').classList.remove('hidden');}
function round(x,y,w,h,r){const c=G.x;c.beginPath();c.roundRect(x,y,w,h,r);}
function drawChar(cx,cy,idx,scale=1,rot=0,driver=false){const c=G.x,ch=chars[idx];c.save();c.translate(cx,cy);c.rotate(rot);c.scale(scale,scale);c.lineWidth=2.2;c.strokeStyle='#091015';c.fillStyle=ch.shirt;c.beginPath();c.roundRect(-15,6,30,31,7);c.fill();c.stroke();c.fillStyle=ch.skin;c.beginPath();c.arc(0,0,13,0,Math.PI*2);c.fill();c.stroke();c.fillStyle=ch.hair;c.beginPath();c.arc(0,-4,13,Math.PI,Math.PI*2);c.lineTo(11,1);c.quadraticCurveTo(0,-11,-12,1);c.fill();if(idx===0||idx===4){c.fillStyle='#111';c.fillRect(-11,-2,22,5)}if(idx===2){c.strokeStyle='#111';c.lineWidth=3;c.beginPath();c.moveTo(6,-4);c.lineTo(11,4);c.stroke()}if(idx===3){c.strokeStyle='#111';c.lineWidth=2;c.beginPath();c.arc(0,1,7,0,Math.PI*2);c.stroke()}if(idx===5){c.fillStyle='#d5b342';c.fillRect(-12,-13,24,7)}c.strokeStyle='#091015';c.lineWidth=4;c.beginPath();c.moveTo(-9,34);c.lineTo(-10,48);c.moveTo(9,34);c.lineTo(10,48);c.stroke();if(driver){c.fillStyle='#dff6ff';c.font='900 9px monospace';c.textAlign='center';c.fillText('DRIVER',0,-23)}c.restore()}
function drawTruck(sx,sy,tilt){const c=G.x;c.save();c.translate(sx,sy);c.rotate(tilt*.12);c.shadowColor='#000';c.shadowBlur=12;c.fillStyle='#dfe7e8';c.strokeStyle='#111b20';c.lineWidth=3;c.beginPath();c.roundRect(-117,-47,190,49,8);c.fill();c.stroke();c.fillStyle='#cbd5d7';c.fillRect(-117,-46,107,11);c.strokeRect(-117,-46,107,11);c.fillStyle='#d7e4e7';c.beginPath();c.roundRect(55,-82,78,83,9);c.fill();c.stroke();c.fillStyle='#7db3ca';c.beginPath();c.moveTo(68,-69);c.lineTo(119,-69);c.lineTo(119,-42);c.lineTo(67,-42);c.closePath();c.fill();c.stroke();c.fillStyle='#192227';c.beginPath();c.arc(-75,5,25,0,Math.PI*2);c.arc(93,5,25,0,Math.PI*2);c.fill();c.fillStyle='#aeb8bc';c.beginPath();c.arc(-75,5,10,0,Math.PI*2);c.arc(93,5,10,0,Math.PI*2);c.fill();c.fillStyle='#1a2227';c.font='900 11px monospace';c.textAlign='center';c.fillText('SASAO',92,-13);drawChar(88,-48,G.driver,.58,0,true);
 const passengerIdx=[0,1,2,3,4,5].filter(i=>i!==G.driver);riders.forEach((r,i)=>{drawChar(-68+r.x*.62,-67+r.y*.65,passengerIdx[i],.68,r.rot*.3)});c.restore()}
function draw(){const c=G.x;c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,540,960);const shx=G.shake?rr(-G.shake,G.shake):0, shy=G.shake?rr(-G.shake,G.shake):0;c.save();c.translate(shx,shy);
 const sky=c.createLinearGradient(0,0,0,680);sky.addColorStop(0,'#061522');sky.addColorStop(.55,'#284250');sky.addColorStop(1,'#91a6a5');c.fillStyle=sky;c.fillRect(-20,-20,580,760);for(const s of G.stars){c.globalAlpha=s.a;c.fillStyle='#dff8ff';c.fillRect(s.x,s.y,s.s,s.s)}c.globalAlpha=1;
 // distant mountains
 c.fillStyle='#1b3138';c.beginPath();c.moveTo(0,520);for(let x=0;x<=540;x+=40)c.lineTo(x,460+Math.sin((x+G.dist*.04)*.012)*45+Math.sin((x+100)*.035)*18);c.lineTo(540,700);c.lineTo(0,700);c.fill();c.fillStyle='#29454a';c.beginPath();c.moveTo(0,560);for(let x=0;x<=540;x+=30)c.lineTo(x,520+Math.sin((x+G.dist*.08)*.018)*34);c.lineTo(540,700);c.lineTo(0,700);c.fill();
 const roadY=terrain(G.dist);c.fillStyle='#344b40';c.beginPath();c.moveTo(0,roadY-38);for(let x=0;x<=540;x+=12)c.lineTo(x,terrain(G.dist+(x-170)*1.15)-38);c.lineTo(540,960);c.lineTo(0,960);c.fill();c.fillStyle='#778071';c.beginPath();c.moveTo(0,roadY);for(let x=0;x<=540;x+=10)c.lineTo(x,terrain(G.dist+(x-170)*1.15));c.lineTo(540,960);c.lineTo(0,960);c.fill();c.strokeStyle='#a0a28f';c.lineWidth=3;c.beginPath();for(let x=0;x<=540;x+=10){const y=terrain(G.dist+(x-170)*1.15)-2;if(x===0)c.moveTo(x,y);else c.lineTo(x,y)}c.stroke();
 // road detail
 c.strokeStyle='#4e564d';c.lineWidth=1;for(let x=0;x<540;x+=38){const wx=G.dist+(x-170)*1.15;c.beginPath();c.moveTo(x,terrain(wx)+10);c.lineTo(x+rr(8,28),terrain(wx+30)+17);c.stroke()}
 // rocks
 for(const r of G.rocks){const sx=170+(r.x-G.dist)/1.15;if(sx<-80||sx>620)continue;c.fillStyle=r.hit?'#4a423a':'#2d3434';c.strokeStyle='#121616';c.lineWidth=3;c.beginPath();c.arc(sx,r.y,r.r,0,Math.PI*2);c.fill();c.stroke();}
 // river goal glow
 const goalX=170+(G.goal-G.dist)/1.15;if(goalX<700&&goalX>-50){c.fillStyle='#6fb3c3';c.globalAlpha=.8;c.fillRect(goalX,680,700,280);c.globalAlpha=1;c.fillStyle='#d8fbff';c.font='900 16px monospace';c.fillText('ササオ川',Math.max(350,goalX+50),706)}
 for(const p of G.dust){c.globalAlpha=clamp(p.l*2,0,1);c.fillStyle='#d5d0b3';c.beginPath();c.arc(p.x,p.y,rr(2,5),0,Math.PI*2);c.fill()}c.globalAlpha=1;drawTruck(170,roadY-6,G.tilt);for(const p of G.particles){c.globalAlpha=clamp(p.l*1.8,0,1);c.fillStyle='#e6fbff';c.fillRect(p.x,p.y,p.m,p.m)}c.globalAlpha=1;c.restore();
 // HUD
 c.fillStyle='#050b10dc';c.fillRect(14,14,512,118);c.strokeStyle='#d8edf7';c.lineWidth=1.5;c.strokeRect(14.5,14.5,511,117);c.fillStyle='#e7f6ff';c.font='900 12px monospace';c.fillText('SASAO RIVER',28,38);c.font='900 20px monospace';c.fillText(Math.max(0,Math.floor(G.goal-G.dist))+' m',28,64);c.fillStyle='#5b6870';c.fillRect(28,78,250,11);c.fillStyle=G.hp>35?'#e2eef2':'#fff';c.fillRect(28,78,250*clamp(G.hp/100,0,1),11);c.fillStyle='#c9d8df';c.font='700 10px monospace';c.fillText('TRUCK HP '+Math.max(0,Math.floor(G.hp))+'%',28,104);c.fillText('SPEED '+Math.floor(G.speed)+'',160,104);c.fillStyle='#dff6ff';c.font='900 13px monospace';c.fillText('DRIVER '+chars[G.driver].name,304,43);c.font='700 10px monospace';c.fillText(chars[G.driver].skill,304,63);c.fillStyle=G.skillCD[G.driver]<=0?'#dfffe5':'#8b99a0';c.fillText(G.skillCD[G.driver]<=0?'SPECIAL READY':'あと '+G.skillCD[G.driver].toFixed(1)+'s',304,84);
 // driver buttons
 const by=815,bw=82,bh=58;for(let i=0;i<6;i++){const bx=17+i*86;c.fillStyle=i===G.driver?'#dbeef6':'#0b151d';c.strokeStyle=i===G.driver?'#fff':'#60727c';c.lineWidth=1.5;c.beginPath();c.roundRect(bx,by,bw,bh,8);c.fill();c.stroke();c.fillStyle=i===G.driver?'#0a1116':'#e7f5fa';c.font='900 10px monospace';c.textAlign='center';c.fillText(chars[i].short,bx+bw/2,by+22);c.font='700 9px monospace';c.fillText(G.skillCD[i]>0?G.skillCD[i].toFixed(0)+'s':'交代',bx+bw/2,by+41)}c.textAlign='start';
 // skill button
 c.fillStyle=G.skillCD[G.driver]<=0?'#e8f8ff':'#19242b';c.strokeStyle='#fff';c.lineWidth=2;c.beginPath();c.roundRect(25,890,490,52,10);c.fill();c.stroke();c.fillStyle=G.skillCD[G.driver]<=0?'#071019':'#88989f';c.font='900 15px monospace';c.textAlign='center';c.fillText(chars[G.driver].skill+'　—　'+chars[G.driver].desc,270,922);c.textAlign='start';
 if(G.warnT>0){c.globalAlpha=clamp(G.warnT*2,0,1);c.fillStyle='#05080ddc';c.fillRect(85,156,370,50);c.strokeStyle='#dff6ff';c.strokeRect(85.5,156.5,369,49);c.fillStyle='#fff';c.font='900 14px monospace';c.textAlign='center';c.fillText(G.warning,270,187);c.textAlign='start';c.globalAlpha=1}
 if(G.flash>0){c.globalAlpha=G.flash*.35;c.fillStyle='#fff';c.fillRect(0,0,540,960);c.globalAlpha=1}
}
function pos(e){const r=G.c.getBoundingClientRect();return{x:(e.clientX-r.left)*540/r.width,y:(e.clientY-r.top)*960/r.height}}
function loop(t){const dt=Math.min(.033,(t-G.last)/1000||0);G.last=t;update(dt);draw();requestAnimationFrame(loop)}
window.addEventListener('load',()=>{G.c=document.getElementById('game');G.x=G.c.getContext('2d');G.x.imageSmoothingEnabled=true;initWorld();G.c.addEventListener('pointerdown',e=>{e.preventDefault();const p=pos(e);if(G.state!=='PLAY')return;if(p.y>890){useSkill();return}if(p.y>805&&p.y<880){const i=Math.floor((p.x-17)/86);if(i>=0&&i<6)switchDriver(i);return}G.drag=true;G.inputX=p.x});G.c.addEventListener('pointermove',e=>{if(!G.drag||G.state!=='PLAY')return;const p=pos(e);G.inputX=p.x;G.targetTilt=clamp((p.x-270)/190,-1,1)});['pointerup','pointercancel','pointerout'].forEach(n=>G.c.addEventListener(n,()=>{G.drag=false;G.targetTilt=0}));document.getElementById('startButton').onclick=()=>{sfx('tap');document.getElementById('start').classList.add('hidden');reset()};document.getElementById('restartButton').onclick=()=>{sfx('tap');document.getElementById('ending').classList.add('hidden');reset()};requestAnimationFrame(loop)});
</script></body></html>
